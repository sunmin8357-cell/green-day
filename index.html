        // 메인 App 컴포넌트
        function App() {
            const [activeTab, setActiveTab] = useState('home');
            // 템플릿화: 사용자가 실제로 작성한 기록만 반영 (기본값 빈 배열)
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('greenday_records');
                return saved !== null ? JSON.parse(saved) : [];
            });
            const [notificationMsg, setNotificationMsg] = useState(null);
            const [username, setUsername] = useState(() => localStorage.getItem('greenday_username') || '초록별 여행자');
            const [userAvatar, setUserAvatar] = useState(() => localStorage.getItem('greenday_avatar') || '🌱');
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [isProfileOpen, setIsProfileOpen] = useState(false);
            const [diarySelectedDate, setDiarySelectedDate] = useState(() => new Date().toISOString().split('T')[0]);

            // 로컬 스토리지 동기화
            useEffect(() => {
                localStorage.setItem('greenday_records', JSON.stringify(records));
            }, [records]);

            // 알림 팝업 타이머
            const showToast = (msg) => {
                setNotificationMsg(msg);
                setTimeout(() => setNotificationMsg(null), 3000);
            };

            // 오늘 및 어제 날짜 계산 (YYYY-MM-DD)
            const todayDateStr = new Date().toISOString().split('T')[0];
            const yesterdayDateStr = new Date(Date.now() - 86400000).toISOString().split('T')[0];
            const currentYearMonth = todayDateStr.substring(0, 7);

            // 1. 오늘의 탄소 절감량 (실제 입력 연동)
            const todayRecord = records.find(r => r.date === todayDateStr);
            const todaySaving = todayRecord ? Math.round(todayRecord.totalSavingKg * 100) / 100 : 0.00;

            // 2. 어제와의 절감량 비교
            const yesterdayRecord = records.find(r => r.date === yesterdayDateStr);
            const yesterdaySaving = yesterdayRecord ? Math.round(yesterdayRecord.totalSavingKg * 100) / 100 : 0.00;
            const diffWithYesterday = Math.round((todaySaving - yesterdaySaving) * 100) / 100;

            // 3. 최근 7일(이번 주) 절감량
            const past7Days = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(Date.now() - (6 - i) * 86400000);
                return d.toISOString().split('T')[0];
            });
            const thisWeekSavings = Math.round(
                records.filter(r => past7Days.includes(r.date))
                       .reduce((sum, r) => sum + (r.totalSavingKg || 0), 0) * 100
            ) / 100;

            // 4. 이번 달 절감량
            const thisMonthSavings = Math.round(
                records.filter(r => r.date && r.date.startsWith(currentYearMonth))
                       .reduce((sum, r) => sum + (r.totalSavingKg || 0), 0) * 100
            ) / 100;

            // 5. 총 누적 절감량
            const totalSavingsAll = Math.round(
                records.reduce((sum, r) => sum + (r.totalSavingKg || 0), 0) * 100
            ) / 100;

            // 6. 소나무 식재 효과 (1그루당 연간 6.6kg 흡수 기준)
            const pineTrees = (totalSavingsAll / 6.6).toFixed(1);

            // 7. 총 실천 횟수
            const totalActionCount = records.reduce((sum, r) => sum + (r.activities ? r.activities.length : 0), 0);

            // 8. 연속 기록일(Streak) 실시간 계산
            const streakDays = useMemo(() => {
                if (!records || records.length === 0) return 0;
                const dateSet = new Set(records.map(r => r.date));
                let streak = 0;
                let checkDate = new Date();
                if (!dateSet.has(todayDateStr)) {
                    if (!dateSet.has(yesterdayDateStr)) return 0;
                    checkDate = new Date(Date.now() - 86400000);
                }
                while (true) {
                    const dStr = checkDate.toISOString().split('T')[0];
                    if (dateSet.has(dStr)) {
                        streak++;
                        checkDate = new Date(checkDate.getTime() - 86400000);
                    } else {
                        break;
                    }
                }
                return streak;
            }, [records, todayDateStr, yesterdayDateStr]);

            // 9. 가장 많이 실천한 행동 집계
            const { mostFrequentAction, maxActionCount } = useMemo(() => {
                const actCounts = {};
                records.forEach(r => {
                    (r.activities || []).forEach(a => {
                        const name = a.content || a.category || '기타';
                        actCounts[name] = (actCounts[name] || 0) + 1;
                    });
                });
                let best = '기록 없음';
                let max = 0;
                Object.entries(actCounts).forEach(([name, count]) => {
                    if (count > max) {
                        max = count;
                        best = name;
                    }
                });
                return { mostFrequentAction: best, maxActionCount: max };
            }, [records]);

            // 10. 일별 절감량 (최근 7일 SVG 차트)
            const dailyData = useMemo(() => {
                const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
                return past7Days.map(dStr => {
                    const dObj = new Date(dStr + 'T00:00:00');
                    const dayLabel = dayLabels[dObj.getDay()];
                    const m = dObj.getMonth() + 1;
                    const d = dObj.getDate();
                    const rec = records.find(r => r.date === dStr);
                    const val = rec ? (rec.totalSavingKg || 0) : 0;
                    return {
                        dateStr: dStr,
                        date: `${m}/${d}`,
                        label: dStr === todayDateStr ? '오늘' : dayLabel,
                        val: Math.round(val * 100) / 100,
                        isToday: dStr === todayDateStr

                });

            // 11. 행동별 절감 비율 (도넛 차트 데이터)

                const categorySavings = { '이동': 0, '식사': 0, '전자기기': 0, '일회용품': 0, '기타': 0 };
                records.forEach(r => {
                    (r.activities || []).forEach(a => {
                        const cat = a.category in categorySavings ? a.category : '기타';
                        categorySavings[cat] += (a.savingKg || 0);
                    });
                });
                const total = Object.values(categorySavings).reduce((a, b) => a + b, 0);
                const categories = [
                    { label: '이동', val: categorySavings['이동'], color: '#2E7D32', icon: 'fa-bicycle' },
                    { label: '식사', val: categorySavings['식사'], color: '#4CAF50', icon: 'fa-bowl-rice' },
                    { label: '전자기기', val: categorySavings['전자기기'], color: '#81C784', icon: 'fa-plug' },

                    { label: '기타', val: categorySavings['기타'], color: '#90A4AE', icon: 'fa-ellipsis' }
                ].map(cat => ({
                    ...cat,
                    pct: total > 0 ? Math.round((cat.val / total) * 100) : 0
                }));
                return { donutCategories: categories, totalCategorySavings: total };

        function SearchModal({ isOpen, onClose, records, onSelectRecord, onSelectGlobal }) {
            const [query, setQuery] = useState('');
            if (!isOpen) return null;

            const filteredRecords = query.trim() ? records.filter(r => 
                (r.diary && r.diary.toLowerCase().includes(query.toLowerCase())) ||
                (r.date && r.date.includes(query)) ||
                (r.activities && r.activities.some(a => a.content && a.content.toLowerCase().includes(query.toLowerCase())))
            ) : [];

            const filteredGlobal = query.trim() ? OWID_GLOBAL_EMISSIONS.filter(c =>
                c.nameKo.includes(query) || c.country.toLowerCase().includes(query.toLowerCase())
            ) : [];

            return (
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-start justify-center pt-16 px-4 animate-fade-in" onClick={onClose}>
                    <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl border border-emerald-100 overflow-hidden" onClick={e => e.stopPropagation()}>
                        {/* 검색 입력창 */}

                            <i class="fa-solid fa-magnifying-glass text-emerald-600 text-lg"></i>
                            <input 
                                type="text" 
                                autoFocus
                                value={query}
                                onChange={e => setQuery(e.target.value)}
                                placeholder="다이어리 일기, 날짜(YYYY-MM-DD), 실천 행동, 국가 검색..."
                                class="flex-1 bg-transparent border-none outline-none text-sm text-slate-800 placeholder-slate-400"
                            />

                                <button onClick={() => setQuery('')} class="text-slate-400 hover:text-slate-600 text-xs p-1">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            )}

                                닫기 ESC

                            <span class="font-bold text-emerald-950">오늘의 지구 상식: </span>
                            <span class="text-emerald-900/80">하루 10km를 자동차 대신 자전거로 이동하면 연간 약 240kg의 CO₂ 배출을 줄일 수 있습니다!</span>
                        </div>
                    </div>
                </div>
            );
        }

        /* ========================================================
           TAB 2: 🗓 다이어리 (Diary)
           ======================================================== */
        function DiaryTab({ records, setRecords, showToast, selectedDate: propSelectedDate, setSelectedDate: propSetSelectedDate }) {
            const todayStr = useMemo(() => new Date().toISOString().slice(0, 10), []);
            const [localDate, setLocalDate] = useState(propSelectedDate || todayStr);
            const selectedDate = propSelectedDate !== undefined ? propSelectedDate : localDate;
            const setSelectedDate = propSetSelectedDate || setLocalDate;

            const [diaryNote, setDiaryNote] = useState('');
            const [mood, setMood] = useState('😄');
            const [activities, setActivities] = useState([
                { id: '1', category: '이동', content: '', amount: 1, unit: '회', factor: 0.1 }
            ]);
            const [viewMode, setViewMode] = useState('write'); // 'write' or 'calendar'

            // 날짜 변경 시 기존 기록 불러오기
            useEffect(() => {
                const found = records.find(r => r.date === selectedDate);
                if (found) {
                    setDiaryNote(found.diary || '');
                    setMood(found.mood || '😄');
                    if (found.activities && found.activities.length > 0) {
                        setActivities(found.activities.map(a => ({
                            id: a.id || Math.random().toString(),
                            category: a.category || '기타',
                            content: a.content || '',
                            amount: a.amount || 1,
                            unit: a.unit || '회',
                            factor: (a.savingKg && a.amount) ? (a.savingKg / a.amount) : 0.1
                        })));
                    }
                } else {
                    setDiaryNote('');
                    setMood('😄');
                    setActivities([
                        { id: Date.now().toString(), category: '이동', content: '', amount: 1, unit: '회', factor: 0.1 }
                    ]);
                }
            }, [selectedDate, records]);

            // 기분 이모지 옵션 5가지
            const moods = [
                { emoji: '😄', label: '매우 좋음' },
                { emoji: '🙂', label: '좋음' },
                { emoji: '😐', label: '보통' },
                { emoji: '🙁', label: '조금 아쉬움' },
                { emoji: '😫', label: '힘듦' }
            ];

            // 항목 추가
            const handleAddActivity = () => {
                const newAct = {
                    id: Date.now().toString(),
                    category: '일회용품',
                    content: '개인 텀블러 사용',
                    amount: 1,
                    unit: '회',
                    factor: 0.10
                };
                setActivities([...activities, newAct]);
            };

            // 항목 삭제
            const handleDeleteActivity = (id) => {
                if (activities.length === 1) {
                    showToast('최소 한 개의 실천 항목이 필요합니다.');
                    return;
                }
                setActivities(activities.filter(a => a.id !== id));
            };

            // 항목 필드 변경
            const handleActivityChange = (id, field, value) => {
                setActivities(activities.map(a => {
                    if (a.id === id) {
                        const updated = { ...a, [field]: value };
                        // 프리셋 선택 시 factor 자동 설정
                        if (field === 'preset') {
                            const foundPreset = ACTIVITY_PRESETS.find(p => p.label === value);
                            if (foundPreset) {
                                updated.category = foundPreset.category;
                                updated.content = foundPreset.defaultContent;
                                updated.unit = foundPreset.unit;
                                updated.factor = foundPreset.factor;
                            }
                        }
                        return updated;
                    }
                    return a;
                }));
            };

            // 실시간 예상 절감량 계산
            const estimatedTotalKg = useMemo(() => {
                const sum = activities.reduce((acc, a) => {
                    const amt = parseFloat(a.amount) || 0;
                    const f = parseFloat(a.factor) || 0;
                    return acc + (amt * f);
                }, 0);
                return Math.round(sum * 100) / 100;
            }, [activities]);

            // 저장 핸들러
            const handleSave = (e) => {
                e.preventDefault();
                const newEntry = {
                    id: `rec-${selectedDate.replace(/-/g, '')}`,
                    date: selectedDate,
                    mood: mood,
                    diary: diaryNote,
                    activities: activities.map(a => ({
                        id: a.id,
                        category: a.category,
                        content: a.content || '친환경 행동 실천',
                        amount: parseFloat(a.amount) || 1,
                        unit: a.unit || '회',
                        savingKg: Math.round(((parseFloat(a.amount) || 1) * (parseFloat(a.factor) || 0.1)) * 100) / 100
                    })),
                    totalSavingKg: estimatedTotalKg
                };

                const existingIndex = records.findIndex(r => r.date === selectedDate);
                let updatedRecords;
                if (existingIndex >= 0) {
                    updatedRecords = [...records];
                    updatedRecords[existingIndex] = newEntry;
                } else {
                    updatedRecords = [newEntry, ...records];
                }

                setRecords(updatedRecords);
                showToast(`다이어리가 저장되었습니다! (절감량: +${estimatedTotalKg.toFixed(2)} kg CO₂)`);
            };

            // 오늘 날짜로 즉시 이동
            const setToday = () => {
                const t = new Date().toISOString().slice(0, 10);
                setSelectedDate(t);
            };

            return (
                <div class="space-y-6">
                    {/* 상단 바 (Top Bar) */}
                    <div class="bg-white p-5 rounded-2xl shadow-xs border border-emerald-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-2 text-xs font-semibold text-emerald-700 mb-1">
                                <i class="fa-solid fa-arrow-left text-[11px]"></i>
                                <span>다이어리 작성하기</span>
                            </div>
                            <h2 class="text-xl font-black text-slate-800">
                                오늘의 일상을 기록하고, 탄소 절감량을 확인해보세요!
                            </h2>
                        </div>
                        <div class="flex items-center gap-2">
                            {/* 뷰 전환 버튼 */}
                            <div class="bg-slate-100 p-1 rounded-xl flex text-xs font-semibold mr-1">
                                <button 
                                    onClick={() => setViewMode('write')}
                                    class={`px-3 py-1.5 rounded-lg transition ${viewMode === 'write' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500'}`}
                                >
                                    <i class="fa-solid fa-pen-nib mr-1"></i> 작성
                                </button>
                                <button 
                                    onClick={() => setViewMode('calendar')}
                                    class={`px-3 py-1.5 rounded-lg transition ${viewMode === 'calendar' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500'}`}
                                >
                                    <i class="fa-solid fa-calendar-days mr-1"></i> 캘린더
                                </button>
                            </div>
                            {/* 날짜 선택 인풋 */}
                            <input 
                                type="date" 
                                value={selectedDate}
                                onChange={(e) => setSelectedDate(e.target.value)}
                                class="border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 bg-white focus:outline-none focus:border-emerald-500 cursor-pointer shadow-xs"
                            />
                            <button 
                                onClick={setToday}
                                class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs px-3 py-2 rounded-xl border border-emerald-200 transition cursor-pointer"
                            >
                                오늘
                            </button>
                        </div>
                    </div>

                    {viewMode === 'calendar' ? (
                        /* 캘린더 서브 뷰 */
                        <CalendarView 
                            records={records} 
                            selectedDate={selectedDate} 
                            onSelectDate={(d) => { setSelectedDate(d); setViewMode('write'); }} 
                        />
                    ) : (
                        /* 다이어리 작성 폼 */
                        <form onSubmit={handleSave} class="space-y-6">
                            {/* 기분 셀렉터 (Mood Selector) */}
                            <div class="bg-white p-6 rounded-2xl shadow-xs border border-emerald-100">
                                <label class="block text-xs font-bold text-slate-700 mb-3">
                                    오늘의 기분은 어떤가요?
                                </label>
                                <div class="grid grid-cols-5 gap-2 sm:gap-4">
                                    {moods.map((m) => {
                                        const isSelected = mood === m.emoji;
                                        return (
                                            <button
                                                type="button"
                                                key={m.label}
                                                onClick={() => setMood(m.emoji)}
                                                class={`p-3 rounded-2xl border text-center transition flex flex-col items-center gap-1 cursor-pointer ${
                                                    isSelected 
                                                        ? 'border-emerald-500 bg-emerald-50/80 ring-2 ring-emerald-200 shadow-xs scale-105' 
                                                        : 'border-slate-200 hover:border-slate-300 bg-slate-50/40'
                                                }`}
                                            >
                                                <span class="text-2xl sm:text-3xl">{m.emoji}</span>
                                                <span class={`text-[11px] font-semibold ${isSelected ? 'text-emerald-800' : 'text-slate-500'}`}>
                                                    {m.label}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 일기 텍스트 박스 (Daily Note Input) */}
                            <div class="bg-white p-6 rounded-2xl shadow-xs border border-emerald-100">
                                <div class="flex items-center justify-between mb-2">
                                    <label class="block text-xs font-bold text-slate-700">
                                        오늘의 일기
                                    </label>
                                    <span class={`text-[11px] font-medium ${diaryNote.length > 500 ? 'text-rose-500 font-bold' : 'text-slate-400'}`}>
                                        {diaryNote.length}/500
                                    </span>
                                </div>
                                <textarea
                                    value={diaryNote}
                                    maxLength={500}
                                    onChange={(e) => setDiaryNote(e.target.value)}
                                    rows="4"
                                    placeholder="오늘 하루 동안 지구를 생각하며 실천했던 소소한 생각이나 일상을 적어보세요..."
                                    class="w-full border border-slate-200 rounded-xl p-3.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition leading-relaxed resize-none"
                                ></textarea>
                            </div>

                            {/* 친환경 활동 입력 폼 (Carbon Reduction Activity Form) */}
                            <div class="bg-white p-6 rounded-2xl shadow-xs border border-emerald-100 space-y-4">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                            <i class="fa-solid fa-seedling text-emerald-600"></i> 실천한 친환경 활동
                                        </h3>
                                        <p class="text-xs text-slate-400 mt-0.5">활동 내용과 수량을 적으면 공식 기준에 따라 감축량이 자동 계산됩니다.</p>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={handleAddActivity}
                                        class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1.5 rounded-xl border border-emerald-200 transition flex items-center gap-1.5 cursor-pointer"
                                    >
                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                        <span>항목 추가</span>
                                    </button>
                                </div>

                                {/* 동적 활동 목록 */}
                                <div class="space-y-3">
                                    {activities.map((act, idx) => (
                                        <div key={act.id} class="p-3.5 bg-slate-50/70 border border-slate-200 rounded-xl flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                                            {/* 간편 프리셋 선택 드롭다운 */}
                                            <div class="w-full sm:w-44 shrink-0">
                                                <select 
                                                    onChange={(e) => handleActivityChange(act.id, 'preset', e.target.value)}
                                                    class="w-full text-xs font-semibold bg-white border border-slate-200 rounded-lg px-2.5 py-2 text-slate-700 focus:outline-none focus:border-emerald-500"
                                                >
                                                    <option value="">⚡ 간편 활동 선택</option>
                                                    {ACTIVITY_PRESETS.map(p => (
                                                        <option key={p.label} value={p.label}>{p.label}</option>
                                                    ))}
                                                </select>
                                            </div>

                                            {/* 내용 입력창 */}
                                            <div class="flex-1">
                                                <input 
                                                    type="text"
                                                    value={act.content}
                                                    placeholder="예: 집에서 자전거 타고 출퇴근"
                                                    onChange={(e) => handleActivityChange(act.id, 'content', e.target.value)}
                                                    class="w-full text-xs bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500"
                                                />
                                            </div>

                                            {/* 수량 / 거리 / 시간 */}
                                            <div class="flex items-center gap-1.5 w-full sm:w-32">
                                                <input 
                                                    type="number"
                                                    step="any"
                                                    min="0"
                                                    value={act.amount}
                                                    onChange={(e) => handleActivityChange(act.id, 'amount', e.target.value)}
                                                    class="w-16 text-xs text-center font-bold bg-white border border-slate-200 rounded-lg px-2 py-2 text-slate-800 focus:outline-none focus:border-emerald-500"
                                                />
                                                <span class="text-xs font-semibold text-slate-500">{act.unit || '회'}</span>
                                            </div>

                                            {/* 개별 감축량 표시 */}
                                            <div class="w-24 text-right text-xs font-bold text-emerald-700 shrink-0">
                                                -{((parseFloat(act.amount) || 0) * (parseFloat(act.factor) || 0.1)).toFixed(2)} kg
                                            </div>

                                            {/* 삭제 버튼 */}
                                            <button
                                                type="button"
                                                onClick={() => handleDeleteActivity(act.id)}
                                                class="text-slate-400 hover:text-rose-500 p-2 text-xs transition cursor-pointer"
                                                title="항목 삭제"
                                            >
                                                <i class="fa-regular fa-trash-can"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                {/* 하단 총 예상 절감량 & 저장 버튼 바 */}
                                <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs text-slate-500 font-semibold">예상 절감량:</span>
                                        <span class="text-2xl font-black text-emerald-700">
                                            {estimatedTotalKg.toFixed(2)} <span class="text-sm font-bold text-slate-600">kg CO₂</span>
                                        </span>
                                    </div>
                                    <button
                                        type="submit"
                                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-8 py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-pointer"
                                    >
                                        <i class="fa-solid fa-floppy-disk text-xs"></i>
                                        <span>저장하기</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    )}
                </div>
            );
        }

        // 월간 캘린더 서브 뷰 컴포넌트
        function CalendarView({ records, selectedDate, onSelectDate }) {
            const initialYearMonth = useMemo(() => {
                const base = selectedDate || new Date().toISOString().slice(0, 10);
                const parts = base.split('-');
                return { year: parseInt(parts[0], 10), month: parseInt(parts[1], 10) };
            }, [selectedDate]);

            const [currentYM, setCurrentYM] = useState(initialYearMonth);

            useEffect(() => {
                if (selectedDate) {
                    const parts = selectedDate.split('-');
                    setCurrentYM({ year: parseInt(parts[0], 10), month: parseInt(parts[1], 10) });
                }
            }, [selectedDate]);

            const handlePrevMonth = () => {
                setCurrentYM(prev => {
                    if (prev.month === 1) return { year: prev.year - 1, month: 12 };
                    return { year: prev.year, month: prev.month - 1 };
                });
            };

            const handleNextMonth = () => {
                setCurrentYM(prev => {
                    if (prev.month === 12) return { year: prev.year + 1, month: 1 };
                    return { year: prev.year, month: prev.month + 1 };
                });
            };

            const daysCount = useMemo(() => {
                return new Date(currentYM.year, currentYM.month, 0).getDate();
            }, [currentYM]);

            const firstDayIndex = useMemo(() => {
                return new Date(currentYM.year, currentYM.month - 1, 1).getDay(); // 0 is Sun
            }, [currentYM]);

            const monthStr = String(currentYM.month).padStart(2, '0');
            const ymPrefix = `${currentYM.year}-${monthStr}`;

            const recordedDaysMap = useMemo(() => {
                return records.reduce((acc, cur) => {
                    if (cur.date && cur.date.startsWith(ymPrefix)) {
                        const dayNum = parseInt(cur.date.split('-')[2], 10);
                        acc[dayNum] = cur;
                    }
                    return acc;
                }, {});
            }, [records, ymPrefix]);

            return (
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-emerald-100 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <button 
                                type="button"
                                onClick={handlePrevMonth} 
                                class="w-7 h-7 rounded-lg border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-600 text-xs cursor-pointer"
                                title="이전 달"
                            >
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <h3 class="font-bold text-slate-800 text-sm">{currentYM.year}년 {currentYM.month}월 실천 캘린더</h3>
                            <button 
                                type="button"
                                onClick={handleNextMonth} 
                                class="w-7 h-7 rounded-lg border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-600 text-xs cursor-pointer"
                                title="다음 달"
                            >
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-slate-500">
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 기록 완료</span>
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-200"></span> 미기록</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-2 text-center text-xs">
                        {['일', '월', '화', '수', '목', '금', '토'].map(d => (
                            <div key={d} class="font-bold text-slate-400 py-1">{d}</div>
                        ))}
                        {Array.from({ length: firstDayIndex }).map((_, i) => (
                            <div key={`empty-${i}`} class="h-14"></div>
                        ))}
                        {Array.from({ length: daysCount }, (_, i) => i + 1).map(day => {
                            const dateStr = `${ymPrefix}-${String(day).padStart(2, '0')}`;
                            const isLogged = !!recordedDaysMap[day];
                            const isSelected = selectedDate === dateStr;

                            return (
                                <button
                                    type="button"
                                    key={day}
                                    onClick={() => onSelectDate(dateStr)}
                                    class={`h-14 rounded-xl border flex flex-col items-center justify-between p-1.5 transition text-left cursor-pointer ${
                                        isSelected 
                                            ? 'border-emerald-600 bg-emerald-50/80 ring-2 ring-emerald-300' 
                                            : isLogged 
                                                ? 'border-emerald-200 bg-emerald-50/30 hover:bg-emerald-50' 
                                                : 'border-slate-100 hover:bg-slate-50'
                                    }`}
                                >
                                    <span class={`text-[11px] font-bold ${isSelected ? 'text-emerald-800' : 'text-slate-600'}`}>{day}</span>
                                    {isLogged && (
                                        <div class="flex items-center gap-1">
                                            <span class="text-xs">{recordedDaysMap[day].mood || '🌱'}</span>
                                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                        </div>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        /* ========================================================
           TAB 3: 📊 통계 (Statistics)
           ======================================================== */
        function StatsTab({ records, thisMonthSavings, thisWeekSavings, totalSavingsAll, streakDays, mostFrequentAction, maxActionCount, dailyData, donutCategories, totalCategorySavings, pineTrees }) {
            const [dateRange, setDateRange] = useState('week');

            // 가장 많이 아낀 카테고리
            const topCategory = useMemo(() => {
                if (!donutCategories || donutCategories.length === 0 || totalCategorySavings === 0) return null;
                const sorted = [...donutCategories].sort((a, b) => b.val - a.val);
                return sorted[0].val > 0 ? sorted[0] : null;
            }, [donutCategories, totalCategorySavings]);

            // 일별 차트 최대값 스케일링
            const maxDailyVal = useMemo(() => {
                if (!dailyData || dailyData.length === 0) return 0.5;
                const vals = dailyData.map(d => d.val);
                const max = Math.max(...vals);
                return max > 0 ? max * 1.25 : 0.5;
            }, [dailyData]);

            return (
                <div class="space-y-6">
                    {/* 상단 타이틀 및 상태 */}
                    <div class="bg-white p-5 rounded-2xl shadow-xs border border-emerald-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-black text-slate-800">나의 탄소 절감 통계</h2>
                            <p class="text-xs text-slate-500 mt-0.5">지금까지의 실천 기록을 실시간으로 분석합니다.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                실시간 동기화 상태
                            </span>
                        </div>
                    </div>

            );
        }

        /* ========================================================
           TAB 5: 💡 나의 성장 (My Growth)
           ======================================================== */
        function MyGrowthTab({ userLevel, levelName, levelIcon, levelExpPct, remainingKg, streakDays, badges, totalSavingsAll }) {
            const unlockedCount = badges ? badges.filter(b => b.unlocked).length : 0;
            const totalBadgesCount = badges ? badges.length : 6;

            return (
                <div class="space-y-6">
                    {/* 상단 헤더 */}
                    <div class="bg-white p-5 rounded-2xl shadow-xs border border-emerald-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-xl font-black text-slate-800">나의 친환경 성장</h2>
                            <p class="text-xs text-slate-500 mt-0.5">매일의 작은 탄소 절감이 모여 지구를 위한 큰 숲을 이룹니다.</p>
                        </div>
                        <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 self-start sm:self-auto">
                            누적 절감: {totalSavingsAll.toFixed(2)} kg CO₂
                        </span>
                    </div>

                    {/* 성장 레벨 & 캐릭터 상태 카드 */}
                    <div class="bg-gradient-to-r from-emerald-50 via-green-50 to-emerald-100 p-6 rounded-2xl border border-emerald-200/80 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div class="flex items-center gap-5">
                            <div class="w-20 h-20 bg-white rounded-2xl p-2 flex items-center justify-center text-4xl shadow-sm border border-emerald-200 shrink-0">
                                {levelIcon}
                            </div>
                            <div>
                                <span class="bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                                    LEVEL {userLevel}
                                </span>
                                <h3 class="text-xl font-black text-emerald-950 mt-1">{levelName}</h3>
                                <p class="text-xs text-emerald-800/80 mt-1">
                                    {userLevel < 4 ? (
                                        <>다음 레벨까지 <strong>{remainingKg.toFixed(2)}kg CO₂</strong> 남았습니다!</>
                                    ) : (
                                        <>최고 레벨(울창한 숲)을 달성했습니다! 진정한 지구 수호자!</>
                                    )}
                                </p>
                            </div>
                        </div>

                        {/* 레벨 게이지 바 */}
                        <div class="w-full sm:w-64 bg-white/80 p-4 rounded-xl border border-emerald-200">
                            <div class="flex justify-between text-xs font-bold text-slate-700 mb-1.5">
                                <span>성장 경험치</span>
                                <span class="text-emerald-700">{levelExpPct}%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                                <div class="bg-emerald-600 h-3 rounded-full transition-all duration-500" style={{ width: `${levelExpPct}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* 연속 기록 카드 (Streak Card) */}
                    <div class="bg-white p-6 rounded-2xl shadow-xs border border-emerald-100 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200">
                                    연속 기록 (Streak)
                                </span>
                                <h3 class="text-lg font-bold text-slate-800 mt-2 flex items-center gap-2">
                                    <i class="fa-solid fa-fire text-amber-500"></i> 연속 기록 {streakDays}일째 진행 중!
                                </h3>
                            </div>
                            <span class="text-xs font-bold text-slate-500">목표: 30일 챌린지</span>
                        </div>

                        {/* 30 days progress bar */}
                        <div>
                            <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1.5">
                                <span>30일 챌린지 달성 현황</span>
                                <span class="text-amber-600 font-bold">{streakDays} / 30 일 ({((streakDays / 30) * 100).toFixed(1)}%)</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-4 p-0.5 overflow-hidden border border-slate-200">
                                <div 
                                    class="bg-gradient-to-r from-amber-400 to-amber-500 h-full rounded-full transition-all duration-500" 
                                    style={{ width: `${Math.min(100, (streakDays / 30) * 100)}%` }}
                                ></div>
                            </div>
                        </div>
                    </div>

                    {/* 배지 섹션 ("나의 배지") */}
                    <div class="bg-white p-6 rounded-2xl shadow-xs border border-emerald-100 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-award text-amber-500"></i> 나의 획득 배지
                            </h3>
                            <span class="text-xs text-slate-400">총 {totalBadgesCount}개 중 {unlockedCount}개 획득</span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            {badges.map(b => (
                                <div 
                                    key={b.id} 
                                    class={`p-4 rounded-2xl border transition flex items-start gap-3.5 ${
                                        b.unlocked 
                                            ? 'bg-amber-50/40 border-amber-200/90 shadow-xs' 
                                            : 'bg-slate-50/60 border-slate-200 opacity-60'
                                    }`}
                                >
                                    <div class={`w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0 shadow-xs ${
                                        b.unlocked 
                                            ? `bg-gradient-to-tr ${b.color} text-white` 
                                            : 'bg-slate-200 text-slate-400'
                                    }`}>
                                        <i class={`fa-solid ${b.icon}`}></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between gap-1">
                                            <h4 class="font-bold text-xs text-slate-800 truncate">{b.title}</h4>
                                            <span class={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                                b.unlocked ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-500'
                                            }`}>
                                                {b.tag}
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 mt-1 leading-snug">{b.desc}</p>
                                        {!b.unlocked && b.progress && (
                                            <div class="mt-2 text-[10px] font-semibold text-slate-400">
                                                진행률: {b.progress}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 일일 응원 배너 (Daily Encourage Banner) */}
                    <div class="bg-gradient-to-r from-emerald-100 via-green-100 to-emerald-50 rounded-2xl p-6 border border-emerald-200 flex items-center gap-4">
                        <div class="text-3xl shrink-0">🌱💬</div>
                        <div>
                            <h4 class="font-black text-sm text-emerald-950">"매일 10분, 나를 돌아보고 지구를 돌보는 시간"</h4>
                            <p class="text-xs text-emerald-800 mt-1 leading-relaxed">
                                오늘 하루 동안 아낀 작은 에너지가 모여 내일의 맑은 공기를 만듭니다. 오늘도 함께해주셔서 고마워요!
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // 렌더링 시작
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
